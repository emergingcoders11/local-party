<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Disc -->
  <circle cx="256" cy="256" r="240" fill="#121212" stroke="#1DB954" stroke-width="16" />
  
  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#282828" stroke-width="8" stroke-dasharray="20 10" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#282828" stroke-width="6" />
  
  <!-- Center Vinyl Label (Green) -->
  <circle cx="256" cy="256" r="80" fill="#1DB954" />
  
  <!-- Center Hole -->
  <circle cx="256" cy="256" r="20" fill="#121212" />
  
  <!-- Wi-Fi / Signal waves on the side representing "Local/Network" connection -->
  <path d="M 370 142 A 160 160 0 0 1 370 370" fill="none" stroke="#1DB954" stroke-width="16" stroke-linecap="round" />
  <path d="M 410 102 A 210 210 0 0 1 410 410" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  
  <!-- Music Note in Center -->
  <path d="M 236 210 L 236 270 A 24 20 0 1 1 212 250 A 24 20 0 0 1 236 270" fill="#FFFFFF" />
</svg>